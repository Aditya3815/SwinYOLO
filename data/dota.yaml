# DOTA 1.5 HBB Dataset Configuration for DA-YOLO
#
# Dataset: DOTA-v1.5 (Dataset for Object deTection in Aerial images)
# Source:  https://captain-whu.github.io/DOTA/dataset.html
# Classes: 16 (HBB — axis-aligned; OBB support is future work)
# Tiles:   ~10,595 train / ~3,360 val (pre-tiled, already in zips)
# Image size: 1024px tiles (pre-generated)
#
# The provided zips contain ALREADY TILED images with OBB labels:
#   DOTA_dataset/lebel/train/train.zip       → images + OBB labels
#   DOTA_dataset/lebel/val/val_label.zip     → images + OBB labels
#   DOTA_dataset/test/test.zip               → images only (no labels)
#
# Setup:
#   python utils/dota_hbb_converter.py \
#       --train-zip DOTA_dataset/lebel/train/train.zip \
#       --val-zip   DOTA_dataset/lebel/val/val_label.zip \
#       --out       /data/DOTA/yolo
#
#   python utils/ciou_kmeans.py \
#       --label-dir /data/DOTA/yolo/labels/train \
#       --img-size  1024 --n-clusters 12
#   Paste output anchors into models/da_yolo.yaml.
#
#   python train_da_yolo.py --data data/dota.yaml \
#       --mode scratch --img-size 1024 --batch-size 4 --name dota_scratch

path: /data/DOTA/yolo    # set to --out path from dota_hbb_converter.py

train: images/train
val:   images/val

nc: 16

names:
  0:  plane
  1:  ship
  2:  storage-tank
  3:  baseball-diamond
  4:  tennis-court
  5:  basketball-court
  6:  ground-track-field
  7:  harbor
  8:  bridge
  9:  large-vehicle
  10: small-vehicle
  11: helicopter
  12: roundabout
  13: soccer-ball-field
  14: swimming-pool
  15: container-crane
