# Hyperparameters for DA-YOLO on DOTA 1.5 (HBB, pre-tiled 1024px)
# Tuned for aerial imagery with mixed object sizes — ground vehicles to airport runways.
#
# Key design choices:
#   lr0 = 1e-4      : From-scratch training
#   obj = 0.7       : Background is dominant in aerial tiles — reduce obj weight
#   fl_gamma = 1.5  : DOTA has severe class imbalance (small-vehicle >> harbor/roundabout)
#   copy_paste = 0.4: Helpful for rare classes (helicopter, container-crane)
#   scale = 0.5     : More scale jitter — tiles were pre-made, objects still vary
#   degrees = 0.0   : Aerial imagery — orientation is semantically meaningful
#   mosaic = 1.0    : Beneficial for 16-class diversity
#   loss_type: wiou : WIoU v1 geometric loss

lr0: 0.0001
lrf: 0.005
momentum: 0.937
weight_decay: 0.05
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.0001

box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 0.7
obj_pw: 1.0

loss_type: wiou

iou_t: 0.20
anchor_t: 4.0
fl_gamma: 1.5

label_smoothing: 0.1

hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0           # Aerial — orientation is semantically meaningful
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.5            # Aerial — top/bottom symmetry
fliplr: 0.5
mosaic: 1.0
mixup: 0.1
copy_paste: 0.4        # Helps rare classes: helicopter, container-crane, roundabout
